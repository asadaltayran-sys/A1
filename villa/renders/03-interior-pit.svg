<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2845"/>
      <stop offset="50%" stop-color="#8c5538"/>
      <stop offset="100%" stop-color="#e8a868"/>
    </linearGradient>
    <linearGradient id="walnut03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2f1a"/>
      <stop offset="100%" stop-color="#3a2415"/>
    </linearGradient>
    <linearGradient id="concrete03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4540"/>
      <stop offset="50%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#252018"/>
    </linearGradient>
    <linearGradient id="floor03" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%" stop-color="#a89678"/>
      <stop offset="50%" stop-color="#c4b596"/>
      <stop offset="100%" stop-color="#8a7d65"/>
    </linearGradient>
    <radialGradient id="fire03" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="40%" stop-color="#ff8a3d" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#c4502a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2a1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pendant03" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#fff2c4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="islandWalnut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3a22"/>
      <stop offset="100%" stop-color="#3a2415"/>
    </linearGradient>
    <linearGradient id="cushion03" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#b8a685"/>
    </linearGradient>
    <linearGradient id="glassReflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c47443" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3a2a18" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ceiling: walnut soffit -->
  <rect width="1920" height="220" fill="url(#walnut03)"/>
  <!-- walnut slat lines -->
  <g stroke="#1a1208" stroke-width="1.5" opacity="0.55">
    <line x1="0" y1="40" x2="1920" y2="40"/>
    <line x1="0" y1="80" x2="1920" y2="80"/>
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="0" y1="160" x2="1920" y2="160"/>
    <line x1="0" y1="200" x2="1920" y2="200"/>
  </g>
  <!-- subtle warm wash on ceiling -->
  <rect width="1920" height="220" fill="#ff8a3d" opacity="0.1"/>

  <!-- back wall: board-formed concrete (left 2/3) -->
  <rect x="0" y="220" width="1320" height="640" fill="url(#concrete03)"/>
  <!-- horizontal board lines -->
  <g stroke="#1a1612" stroke-width="2" opacity="0.45">
    <line x1="0" y1="300" x2="1320" y2="300"/>
    <line x1="0" y1="380" x2="1320" y2="380"/>
    <line x1="0" y1="460" x2="1320" y2="460"/>
    <line x1="0" y1="540" x2="1320" y2="540"/>
    <line x1="0" y1="620" x2="1320" y2="620"/>
    <line x1="0" y1="700" x2="1320" y2="700"/>
    <line x1="0" y1="780" x2="1320" y2="780"/>
  </g>
  <!-- vertical concrete board joins (subtle) -->
  <g stroke="#0a0908" stroke-width="1" opacity="0.25">
    <line x1="220" y1="220" x2="220" y2="860"/>
    <line x1="440" y1="220" x2="440" y2="860"/>
    <line x1="660" y1="220" x2="660" y2="860"/>
    <line x1="880" y1="220" x2="880" y2="860"/>
    <line x1="1100" y1="220" x2="1100" y2="860"/>
  </g>

  <!-- right side: retracted floor-to-ceiling glass opening to dusk -->
  <rect x="1320" y="220" width="600" height="640" fill="url(#sky03)"/>
  <!-- distant mountain through opening -->
  <polygon points="1320,640 1500,540 1700,610 1920,560 1920,860 1320,860" fill="#3a2f3d" opacity="0.7"/>
  <!-- glass mullion / steel frame -->
  <rect x="1314" y="220" width="8" height="640" fill="#0a0908"/>
  <rect x="1620" y="220" width="6" height="640" fill="#0a0908" opacity="0.85"/>
  <!-- exterior travertine deck visible through opening -->
  <rect x="1320" y="820" width="600" height="40" fill="#c4b596" opacity="0.6"/>

  <!-- fireplace: blackened steel surround -->
  <rect x="540" y="400" width="380" height="460" fill="#1a1612"/>
  <rect x="540" y="400" width="380" height="8" fill="#2a2520"/>
  <rect x="540" y="852" width="380" height="8" fill="#2a2520"/>
  <!-- firebox opening -->
  <rect x="610" y="540" width="240" height="240" fill="#0a0606"/>
  <!-- fire glow -->
  <ellipse cx="730" cy="700" rx="160" ry="100" fill="url(#fire03)"/>
  <ellipse cx="730" cy="720" rx="90" ry="40" fill="#ffd166" opacity="0.9"/>
  <!-- flame tips -->
  <g fill="#ff8a3d" opacity="0.85">
    <path d="M 690 700 Q 700 640 710 680 Q 715 660 720 690 Z"/>
    <path d="M 730 690 Q 740 620 750 670 Q 755 650 760 685 Z"/>
    <path d="M 760 700 Q 770 645 780 680 Z"/>
  </g>
  <!-- warm wash from fire on walls -->
  <ellipse cx="730" cy="700" rx="500" ry="280" fill="#ff8a3d" opacity="0.08"/>

  <!-- walnut waterfall kitchen island (background, left) -->
  <rect x="60" y="640" width="420" height="40" fill="#c4b596"/>
  <rect x="60" y="680" width="420" height="200" fill="url(#islandWalnut)"/>
  <!-- island travertine top continuing down (waterfall) -->
  <rect x="60" y="640" width="20" height="240" fill="#c4b596"/>
  <!-- brass pulls -->
  <rect x="200" y="740" width="40" height="4" fill="#b8956a"/>
  <rect x="320" y="740" width="40" height="4" fill="#b8956a"/>

  <!-- floor: travertine -->
  <rect y="860" width="1920" height="220" fill="url(#floor03)"/>
  <!-- floor tile grid -->
  <g stroke="#7a6d55" stroke-width="1" opacity="0.4">
    <line x1="320" y1="860" x2="320" y2="1080"/>
    <line x1="640" y1="860" x2="640" y2="1080"/>
    <line x1="960" y1="860" x2="960" y2="1080"/>
    <line x1="1280" y1="860" x2="1280" y2="1080"/>
    <line x1="1600" y1="860" x2="1600" y2="1080"/>
    <line x1="0" y1="970" x2="1920" y2="970"/>
  </g>
  <!-- continuation through glass opening reflection -->
  <rect x="1320" y="860" width="600" height="40" fill="#c4b596" opacity="0.35"/>

  <!-- sunken pit (oval cutout in floor) -->
  <ellipse cx="1100" cy="1000" rx="420" ry="60" fill="#1a1612"/>
  <ellipse cx="1100" cy="990" rx="400" ry="50" fill="url(#cushion03)"/>
  <!-- terracotta cushion accent -->
  <ellipse cx="900" cy="980" rx="80" ry="14" fill="#c4502a" opacity="0.85"/>
  <!-- teal throw blanket accent -->
  <ellipse cx="1280" cy="985" rx="60" ry="10" fill="#1f5560" opacity="0.85"/>
  <!-- step into pit -->
  <rect x="700" y="970" width="800" height="6" fill="#2a2520" opacity="0.6"/>

  <!-- pendant lights with warm glow -->
  <g>
    <line x1="300" y1="220" x2="300" y2="380" stroke="#1a1208" stroke-width="2"/>
    <ellipse cx="300" cy="400" rx="50" ry="30" fill="#b8956a"/>
    <ellipse cx="300" cy="408" rx="40" ry="22" fill="#fff2c4" opacity="0.95"/>
    <ellipse cx="300" cy="420" rx="180" ry="120" fill="url(#pendant03)"/>
  </g>
  <g>
    <line x1="1180" y1="220" x2="1180" y2="320" stroke="#1a1208" stroke-width="2"/>
    <ellipse cx="1180" cy="340" rx="50" ry="30" fill="#b8956a"/>
    <ellipse cx="1180" cy="348" rx="40" ry="22" fill="#fff2c4" opacity="0.95"/>
    <ellipse cx="1180" cy="360" rx="180" ry="120" fill="url(#pendant03)"/>
  </g>

  <!-- glass reflection overlay on right opening (subtle) -->
  <rect x="1320" y="220" width="600" height="640" fill="url(#glassReflect)" opacity="0.15"/>

  <!-- ambient warm wash from dusk light entering from right -->
  <rect x="900" y="220" width="1020" height="860" fill="#ff8a3d" opacity="0.06"/>
</svg>
