<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1838"/>
      <stop offset="50%" stop-color="#1a2855"/>
      <stop offset="100%" stop-color="#3a4878"/>
    </linearGradient>
    <linearGradient id="wall04L" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#252018"/>
      <stop offset="100%" stop-color="#4a4540"/>
    </linearGradient>
    <linearGradient id="wall04C" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4540"/>
      <stop offset="60%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#252018"/>
    </linearGradient>
    <linearGradient id="wall04R" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a4540"/>
      <stop offset="100%" stop-color="#252018"/>
    </linearGradient>
    <linearGradient id="floor04" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#d4c5a8"/>
      <stop offset="50%" stop-color="#b8a685"/>
      <stop offset="100%" stop-color="#7a6d55"/>
    </linearGradient>
    <radialGradient id="canopy" cx="0.5" cy="0.45">
      <stop offset="0%" stop-color="#8a9a72"/>
      <stop offset="50%" stop-color="#5a6a48"/>
      <stop offset="100%" stop-color="#2a3a1a" stop-opacity="0.85"/>
    </radialGradient>
    <radialGradient id="canopyHighlight" cx="0.35" cy="0.3">
      <stop offset="0%" stop-color="#a8b88a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#a8b88a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="interior04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2818"/>
      <stop offset="50%" stop-color="#c4944a"/>
      <stop offset="100%" stop-color="#8c5538"/>
    </linearGradient>
    <linearGradient id="water04" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a30"/>
      <stop offset="100%" stop-color="#2a4045"/>
    </linearGradient>
  </defs>

  <!-- sky strip (open courtyard, looking up at deep cobalt) -->
  <rect width="1920" height="280" fill="url(#sky04)"/>
  <!-- subtle stars (very faint, early evening) -->
  <g fill="#f5efe6" opacity="0.5">
    <circle cx="280" cy="60" r="1"/>
    <circle cx="620" cy="120" r="1.5"/>
    <circle cx="1180" cy="80" r="1"/>
    <circle cx="1560" cy="140" r="1.5"/>
  </g>

  <!-- coping of walls (top edge thin highlight catching last sun) -->
  <rect y="276" width="1920" height="4" fill="#c4944a" opacity="0.4"/>

  <!-- left wall (in perspective, slight shadow on inside face) -->
  <polygon points="0,280 0,1080 280,1080 280,280" fill="url(#wall04L)"/>
  <!-- left wall board-formed concrete lines -->
  <g stroke="#0a0908" stroke-width="1" opacity="0.4">
    <line x1="0" y1="380" x2="280" y2="380"/>
    <line x1="0" y1="500" x2="280" y2="500"/>
    <line x1="0" y1="620" x2="280" y2="620"/>
    <line x1="0" y1="740" x2="280" y2="740"/>
    <line x1="0" y1="860" x2="280" y2="860"/>
  </g>

  <!-- center back wall: full board-formed concrete -->
  <rect x="280" y="280" width="1080" height="600" fill="url(#wall04C)"/>
  <!-- horizontal board lines -->
  <g stroke="#0a0908" stroke-width="1.5" opacity="0.5">
    <line x1="280" y1="360" x2="1360" y2="360"/>
    <line x1="280" y1="440" x2="1360" y2="440"/>
    <line x1="280" y1="520" x2="1360" y2="520"/>
    <line x1="280" y1="600" x2="1360" y2="600"/>
    <line x1="280" y1="680" x2="1360" y2="680"/>
    <line x1="280" y1="760" x2="1360" y2="760"/>
    <line x1="280" y1="840" x2="1360" y2="840"/>
  </g>
  <!-- vertical board joins -->
  <g stroke="#0a0908" stroke-width="1" opacity="0.25">
    <line x1="450" y1="280" x2="450" y2="880"/>
    <line x1="620" y1="280" x2="620" y2="880"/>
    <line x1="790" y1="280" x2="790" y2="880"/>
    <line x1="960" y1="280" x2="960" y2="880"/>
    <line x1="1130" y1="280" x2="1130" y2="880"/>
    <line x1="1300" y1="280" x2="1300" y2="880"/>
  </g>

  <!-- right wall: floor-to-ceiling glass showing warm interior -->
  <rect x="1360" y="280" width="560" height="600" fill="url(#interior04)"/>
  <!-- interior detail: a hint of warm pendant light shape -->
  <ellipse cx="1640" cy="520" rx="120" ry="60" fill="#ffd166" opacity="0.4"/>
  <ellipse cx="1640" cy="500" rx="40" ry="20" fill="#fff2c4" opacity="0.9"/>
  <!-- interior wall hint (back wall behind glass) -->
  <rect x="1360" y="700" width="560" height="180" fill="#3a2818" opacity="0.6"/>
  <!-- steel mullions for glass -->
  <rect x="1354" y="280" width="8" height="600" fill="#0a0908"/>
  <rect x="1916" y="280" width="6" height="600" fill="#0a0908"/>
  <rect x="1500" y="280" width="3" height="600" fill="#0a0908" opacity="0.8"/>
  <rect x="1640" y="280" width="3" height="600" fill="#0a0908" opacity="0.8"/>
  <rect x="1780" y="280" width="3" height="600" fill="#0a0908" opacity="0.8"/>
  <!-- horizontal mullion mid -->
  <rect x="1360" y="540" width="560" height="3" fill="#0a0908" opacity="0.7"/>

  <!-- floor: travertine in large-format grid -->
  <rect y="880" width="1920" height="200" fill="url(#floor04)"/>
  <!-- grid lines -->
  <g stroke="#5a4d3a" stroke-width="1.5" opacity="0.4">
    <line x1="320" y1="880" x2="320" y2="1080"/>
    <line x1="640" y1="880" x2="640" y2="1080"/>
    <line x1="960" y1="880" x2="960" y2="1080"/>
    <line x1="1280" y1="880" x2="1280" y2="1080"/>
    <line x1="1600" y1="880" x2="1600" y2="1080"/>
    <line x1="0" y1="980" x2="1920" y2="980"/>
  </g>

  <!-- linear water channel running across floor -->
  <rect x="0" y="1010" width="1920" height="34" fill="url(#water04)"/>
  <rect x="0" y="1010" width="1920" height="2" fill="#5a7080" opacity="0.5"/>
  <!-- reflection of olive canopy in water -->
  <ellipse cx="960" cy="1027" rx="280" ry="6" fill="#3a4a2a" opacity="0.4"/>
  <!-- sky reflection in water -->
  <rect x="0" y="1010" width="1920" height="14" fill="#1a2855" opacity="0.25"/>

  <!-- olive tree trunk -->
  <path d="M 950 880 L 940 720 Q 935 660 945 640 L 955 620 Q 965 600 970 580 L 975 560 L 985 560 L 990 580 Q 995 600 985 620 L 980 640 Q 985 700 990 880 Z" fill="#3a2a18"/>
  <!-- trunk texture -->
  <path d="M 955 850 L 960 720" stroke="#1a1208" stroke-width="2" opacity="0.6"/>
  <path d="M 975 880 L 980 720" stroke="#1a1208" stroke-width="2" opacity="0.6"/>
  <!-- branches -->
  <path d="M 970 580 Q 920 540 880 510" stroke="#3a2a18" stroke-width="6" fill="none"/>
  <path d="M 975 590 Q 1020 555 1060 530" stroke="#3a2a18" stroke-width="6" fill="none"/>
  <path d="M 968 600 Q 940 575 900 565" stroke="#3a2a18" stroke-width="4" fill="none"/>

  <!-- olive canopy (multi-layered for depth) -->
  <ellipse cx="960" cy="500" rx="360" ry="220" fill="url(#canopy)"/>
  <ellipse cx="860" cy="460" rx="180" ry="120" fill="#4a5a3a" opacity="0.75"/>
  <ellipse cx="1080" cy="480" rx="200" ry="130" fill="#5a6a48" opacity="0.7"/>
  <ellipse cx="960" cy="430" rx="240" ry="110" fill="url(#canopyHighlight)"/>
  <!-- individual leaf clusters (silvery green dots) -->
  <g fill="#a8b88a" opacity="0.6">
    <circle cx="800" cy="450" r="6"/>
    <circle cx="850" cy="420" r="5"/>
    <circle cx="900" cy="400" r="6"/>
    <circle cx="950" cy="390" r="5"/>
    <circle cx="1000" cy="395" r="6"/>
    <circle cx="1060" cy="410" r="5"/>
    <circle cx="1110" cy="440" r="6"/>
    <circle cx="1150" cy="480" r="5"/>
    <circle cx="780" cy="500" r="6"/>
    <circle cx="1180" cy="520" r="5"/>
  </g>
  <g fill="#6a7a5a" opacity="0.7">
    <circle cx="820" cy="540" r="8"/>
    <circle cx="890" cy="560" r="6"/>
    <circle cx="980" cy="570" r="8"/>
    <circle cx="1060" cy="555" r="7"/>
    <circle cx="1130" cy="540" r="6"/>
  </g>

  <!-- dappled shadow on floor from olive -->
  <g fill="#000" opacity="0.28">
    <ellipse cx="760" cy="930" rx="60" ry="14"/>
    <ellipse cx="850" cy="950" rx="80" ry="16"/>
    <ellipse cx="960" cy="965" rx="180" ry="20"/>
    <ellipse cx="1080" cy="950" rx="90" ry="16"/>
    <ellipse cx="1180" cy="930" rx="70" ry="14"/>
  </g>
  <!-- trunk shadow -->
  <ellipse cx="965" cy="900" rx="40" ry="10" fill="#000" opacity="0.5"/>

  <!-- travertine bench (left side, in shadow) -->
  <rect x="180" y="940" width="240" height="50" fill="#a89678"/>
  <rect x="180" y="940" width="240" height="6" fill="#c4b596"/>
  <rect x="180" y="988" width="240" height="6" fill="#5a4d3a"/>
  <!-- bench shadow -->
  <ellipse cx="300" cy="998" rx="130" ry="8" fill="#000" opacity="0.35"/>

  <!-- subtle warm wash from interior glass spilling onto courtyard floor -->
  <polygon points="1360,880 1920,880 1920,1080 1280,1080" fill="#ffb84d" opacity="0.12"/>

  <!-- ambient sky light wash on walls (top) -->
  <rect x="0" y="280" width="1920" height="160" fill="#3a4878" opacity="0.08"/>
</svg>
