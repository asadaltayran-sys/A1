  <g fill="#f5efe6" opacity="0.4">
    <circle cx="600" cy="1020" r="0.8"/>
    <circle cx="820" cy="1015" r="0.8"/>
    <circle cx="1100" cy="1025" r="0.8"/>
    <circle cx="1340" cy="1020" r="0.8"/>
  </g>

  <!-- landscape uplighting on olive trees / agaves -->
  <g>
    <circle cx="280" cy="900" r="4" fill="#ffd166" opacity="0.95"/>
    <ellipse cx="280" cy="900" rx="60" ry="80" fill="#ffd166" opacity="0.18"/>
    <!-- silhouette of small olive tree -->
    <ellipse cx="280" cy="850" rx="50" ry="40" fill="#2a3a1a"/>
    <rect x="276" y="870" width="8" height="40" fill="#1a1208"/>
  </g>
  <g>
    <circle cx="1660" cy="900" r="4" fill="#ffd166" opacity="0.95"/>
    <ellipse cx="1660" cy="900" rx="60" ry="80" fill="#ffd166" opacity="0.18"/>
    <ellipse cx="1660" cy="850" rx="50" ry="40" fill="#2a3a1a"/>
    <rect x="1656" y="870" width="8" height="40" fill="#1a1208"/>
  </g>
