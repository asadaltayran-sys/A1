<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030518"/>
      <stop offset="60%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <radialGradient id="milkyway" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#a89e9a" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#5a5078" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#5a5078" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="upperVol06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0908"/>
      <stop offset="100%" stop-color="#1a1815"/>
    </linearGradient>
    <linearGradient id="lowerVol06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2520"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="interiorGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
