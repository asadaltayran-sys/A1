  <g fill="#1a1208" opacity="0.85">
    <polygon points="380,1050 388,1010 396,1050"/>
    <polygon points="400,1055 410,1005 420,1055"/>
    <polygon points="1540,1050 1548,1010 1556,1050"/>
    <polygon points="1560,1055 1570,1005 1580,1055"/>
