    <circle cx="420" cy="280" r="1"/>
    <circle cx="560" cy="380" r="2"/>
    <circle cx="700" cy="300" r="1"/>
    <circle cx="820" cy="420" r="1.5"/>
    <circle cx="980" cy="320" r="1"/>
    <circle cx="1120" cy="400" r="2"/>
    <circle cx="1260" cy="280" r="1"/>
    <circle cx="1400" cy="360" r="1.5"/>
    <circle cx="1540" cy="320" r="1"/>
    <circle cx="1680" cy="400" r="2"/>
    <circle cx="1820" cy="280" r="1"/>
  </g>
  <g fill="#f5efe6" opacity="0.5">
