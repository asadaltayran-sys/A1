    <rect x="60" y="780" width="6" height="180"/>
    <rect x="80" y="780" width="6" height="180"/>
    <rect x="100" y="780" width="6" height="180"/>
    <rect x="120" y="780" width="6" height="180"/>
    <rect x="140" y="780" width="6" height="180"/>
    <rect x="160" y="780" width="6" height="180"/>
    <rect x="180" y="780" width="6" height="180"/>
    <rect x="200" y="780" width="6" height="180"/>
