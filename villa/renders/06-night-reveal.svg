    <circle cx="200" cy="520" r="1"/>
    <circle cx="340" cy="480" r="1"/>
    <circle cx="480" cy="560" r="1"/>
    <circle cx="620" cy="500" r="1"/>
    <circle cx="760" cy="580" r="1"/>
    <circle cx="900" cy="520" r="1"/>
    <circle cx="1040" cy="600" r="1"/>
    <circle cx="1180" cy="500" r="1"/>
    <circle cx="1320" cy="580" r="1"/>
    <circle cx="1460" cy="520" r="1"/>
    <circle cx="1600" cy="600" r="1"/>
    <circle cx="1740" cy="500" r="1"/>
    <circle cx="1880" cy="580" r="1"/>
