  <!-- subtle vignette -->
  <radialGradient id="vignette06" cx="0.5" cy="0.55" r="0.85">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette06)"/>
</svg>
