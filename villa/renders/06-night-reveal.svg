    <rect x="918" y="540" width="6" height="160"/>
    <rect x="936" y="540" width="6" height="160"/>
    <rect x="954" y="540" width="6" height="160"/>
    <rect x="972" y="540" width="6" height="160"/>
    <rect x="990" y="540" width="6" height="160"/>
  </g>
  <!-- backlit warmth behind timber screen -->
  <rect x="894" y="540" width="108" height="160" fill="#ffb84d" opacity="0.18"/>

  <!-- lower volume: travertine with warm interior glow through full-height glass -->
  <rect x="380" y="720" width="1180" height="180" fill="url(#lowerVol06)"/>
  <!-- main glass strip (warm interior pouring out) -->
  <rect x="440" y="740" width="1080" height="140" fill="url(#interiorGlow)" opacity="0.7"/>
  <!-- subtle interior detail silhouettes through glass -->
  <g fill="#1a0a05" opacity="0.5">
    <rect x="600" y="800" width="40" height="80"/>
    <rect x="780" y="790" width="60" height="90"/>
    <rect x="1100" y="800" width="50" height="80"/>
  </g>
  <!-- steel mullions -->
  <g fill="#0a0908">
    <rect x="436" y="740" width="6" height="140"/>
    <rect x="700" y="740" width="3" height="140"/>
    <rect x="960" y="740" width="3" height="140"/>
    <rect x="1220" y="740" width="3" height="140"/>
    <rect x="1516" y="740" width="6" height="140"/>
