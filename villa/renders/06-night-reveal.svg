    <polygon points="60,920 70,920 90,1080 80,1080"/>
    <polygon points="90,920 100,920 130,1080 120,1080"/>
    <polygon points="120,920 130,920 170,1080 160,1080"/>
    <polygon points="150,920 160,920 210,1080 200,1080"/>
    <polygon points="180,920 190,920 250,1080 240,1080"/>
    <polygon points="1730,920 1740,920 1700,1080 1690,1080"/>
    <polygon points="1760,920 1770,920 1740,1080 1730,1080"/>
    <polygon points="1790,920 1800,920 1780,1080 1770,1080"/>
    <polygon points="1820,920 1830,920 1820,1080 1810,1080"/>
    <polygon points="1850,920 1860,920 1860,1080 1850,1080"/>
  </g>

