  <g fill="#1a1208">
    <rect x="1720" y="780" width="6" height="180"/>
    <rect x="1740" y="780" width="6" height="180"/>
    <rect x="1760" y="780" width="6" height="180"/>
    <rect x="1780" y="780" width="6" height="180"/>
    <rect x="1800" y="780" width="6" height="180"/>
    <rect x="1820" y="780" width="6" height="180"/>
    <rect x="1840" y="780" width="6" height="180"/>
    <rect x="1860" y="780" width="6" height="180"/>
  </g>
  <rect x="1714" y="780" width="160" height="180" fill="#ffb84d" opacity="0.22"/>

  <!-- infinity pool, lit from beneath glowing teal -->
  <rect x="380" y="960" width="1180" height="80" fill="#0d1f24"/>
  <rect x="380" y="960" width="1180" height="6" fill="#6ae0e8" opacity="0.7"/>
  <ellipse cx="970" cy="1000" rx="640" ry="44" fill="url(#poolUplight)"/>
  <!-- pool light dots (in-pool fixtures) -->
  <g fill="#6ae0e8" opacity="0.95">
    <circle cx="500" cy="990" r="4"/>
    <circle cx="720" cy="990" r="4"/>
    <circle cx="970" cy="990" r="4"/>
    <circle cx="1220" cy="990" r="4"/>
    <circle cx="1440" cy="990" r="4"/>
  </g>
  <!-- pool reflection of warm interior -->
  <rect x="440" y="966" width="1080" height="20" fill="#ffb84d" opacity="0.2"/>
