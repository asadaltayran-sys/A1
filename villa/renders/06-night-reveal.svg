    <ellipse cx="960" cy="340" rx="900" ry="60" fill="#f5efe6" opacity="0.04"/>
    <ellipse cx="960" cy="340" rx="700" ry="40" fill="#f5efe6" opacity="0.06"/>
  </g>

  <!-- dense star field (varied brightness) -->
  <g fill="#f5efe6">
    <circle cx="80" cy="60" r="1"/>
    <circle cx="180" cy="120" r="1.5"/>
    <circle cx="240" cy="40" r="1"/>
    <circle cx="320" cy="180" r="2"/>
    <circle cx="380" cy="80" r="1"/>
    <circle cx="440" cy="160" r="1.5"/>
    <circle cx="520" cy="100" r="1"/>
    <circle cx="600" cy="60" r="2.5"/>
    <circle cx="660" cy="140" r="1"/>
    <circle cx="720" cy="200" r="1.5"/>
    <circle cx="780" cy="80" r="1"/>
    <circle cx="840" cy="160" r="2"/>
    <circle cx="900" cy="40" r="1"/>
    <circle cx="960" cy="120" r="1.5"/>
    <circle cx="1020" cy="80" r="1"/>
    <circle cx="1080" cy="180" r="2"/>
    <circle cx="1140" cy="100" r="1.5"/>
