      <stop offset="60%" stop-color="#2a8088" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d1f24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmSpill" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deck06" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a6a55"/>
      <stop offset="100%" stop-color="#3a3028"/>
