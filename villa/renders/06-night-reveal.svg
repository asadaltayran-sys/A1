    <circle cx="1500" cy="80" r="2.5"/>
    <circle cx="1560" cy="160" r="1"/>
    <circle cx="1620" cy="100" r="1.5"/>
    <circle cx="1680" cy="60" r="1"/>
    <circle cx="1740" cy="180" r="2"/>
    <circle cx="1800" cy="120" r="1.5"/>
    <circle cx="1860" cy="80" r="1"/>
