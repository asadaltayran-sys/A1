    <circle cx="1100" cy="180" r="3" fill="#f5efe6"/>
    <circle cx="1100" cy="180" r="10" fill="#f5efe6" opacity="0.15"/>
  </g>

  <!-- distant mountain silhouettes -->
  <polygon points="0,700 240,580 500,660 760,540 1020,640 1280,520 1540,620 1820,560 1920,640 1920,780 0,780" fill="#050818"/>
  <!-- nearer mountain layer -->
  <polygon points="0,770 200,670 460,750 720,620 980,720 1240,610 1500,700 1760,650 1920,730 1920,800 0,800" fill="#0a0d1a"/>

  <!-- upper volume: dark floating mass against sky -->
  <rect x="240" y="500" width="980" height="220" fill="url(#upperVol06)"/>
  <!-- upper volume subtle top edge (catching faint sky) -->
  <rect x="240" y="500" width="980" height="2" fill="#3a3a50" opacity="0.6"/>
