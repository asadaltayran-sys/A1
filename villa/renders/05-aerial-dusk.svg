<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="sky05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1f4a"/>
      <stop offset="35%" stop-color="#5a3a5a"/>
      <stop offset="70%" stop-color="#c47443"/>
      <stop offset="100%" stop-color="#e8a868"/>
    </linearGradient>
    <linearGradient id="terrain05" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#8a6a48"/>
      <stop offset="50%" stop-color="#5a4028"/>
      <stop offset="100%" stop-color="#2a1810"/>
    </linearGradient>
    <linearGradient id="travertineRoof" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#e8d8b8"/>
      <stop offset="100%" stop-color="#a8967a"/>
    </linearGradient>
    <linearGradient id="concreteRoof" x1="0" y1="0" x2="0.8" y2="0.6">
      <stop offset="0%" stop-color="#5a554a"/>
      <stop offset="50%" stop-color="#3a3530"/>
      <stop offset="100%" stop-color="#1a1815"/>
    </linearGradient>
    <linearGradient id="pool05" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1f24"/>
      <stop offset="50%" stop-color="#1a3035"/>
      <stop offset="100%" stop-color="#0a1518"/>
    </linearGradient>
    <radialGradient id="uplight" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="courtyardGlow" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#1a2855"/>
      <stop offset="100%" stop-color="#0a1838"/>
    </radialGradient>
  </defs>

  <!-- horizon sky -->
  <rect width="1920" height="340" fill="url(#sky05)"/>
  <!-- distant haze layer -->
  <rect y="290" width="1920" height="50" fill="#e8a868" opacity="0.3"/>
  <!-- mountain range (multi-layered for atmospheric depth) -->
  <polygon points="0,320 280,220 540,290 820,200 1080,270 1340,210 1620,280 1920,230 1920,340 0,340" fill="#3a2845" opacity="0.55"/>
  <polygon points="0,335 220,270 480,310 760,255 1040,300 1320,260 1600,305 1920,275 1920,340 0,340" fill="#2a1f3a" opacity="0.7"/>
  <!-- mountain ridges catching last sun -->
  <g stroke="#c47443" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M 280,220 L 320,235"/>
    <path d="M 820,200 L 870,220"/>
    <path d="M 1340,210 L 1390,230"/>
  </g>

  <!-- desert terrain (top-down view at angle) -->
  <rect y="340" width="1920" height="740" fill="url(#terrain05)"/>
  <!-- terrain perspective wash (darker toward bottom-foreground) -->
  <rect y="340" width="1920" height="740" fill="url(#terrain05)" opacity="0.3"/>
  <!-- subtle terrain undulations -->
  <g stroke="#3a2818" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 0,440 Q 480,460 960,430 T 1920,450"/>
    <path d="M 0,580 Q 480,600 960,570 T 1920,590"/>
    <path d="M 0,720 Q 480,740 960,710 T 1920,730"/>
    <path d="M 0,860 Q 480,880 960,850 T 1920,870"/>
  </g>
  <!-- rocks scattered -->
  <g fill="#1a1208" opacity="0.55">
    <ellipse cx="180" cy="480" rx="14" ry="8"/>
    <ellipse cx="280" cy="540" rx="20" ry="10"/>
    <ellipse cx="100" cy="660" rx="18" ry="9"/>
    <ellipse cx="220" cy="780" rx="24" ry="12"/>
    <ellipse cx="80" cy="920" rx="22" ry="11"/>
    <ellipse cx="1720" cy="490" rx="16" ry="9"/>
    <ellipse cx="1820" cy="580" rx="22" ry="11"/>
    <ellipse cx="1660" cy="720" rx="18" ry="10"/>
    <ellipse cx="1780" cy="860" rx="26" ry="13"/>
    <ellipse cx="1860" cy="960" rx="20" ry="10"/>
  </g>
  <!-- agave clusters (top-down stars) -->
  <g fill="#3a4a2a" opacity="0.7">
    <g transform="translate(140,720)">
      <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4"/>
    </g>
    <g transform="translate(260,860)">
      <polygon points="0,-14 5,-5 14,0 5,5 0,14 -5,5 -14,0 -5,-5"/>
    </g>
    <g transform="translate(160,920)">
      <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3"/>
    </g>
    <g transform="translate(1660,800)">
      <polygon points="0,-12 4,-4 12,0 4,4 0,12 -4,4 -12,0 -4,-4"/>
    </g>
    <g transform="translate(1760,900)">
      <polygon points="0,-14 5,-5 14,0 5,5 0,14 -5,5 -14,0 -5,-5"/>
    </g>
    <g transform="translate(1820,1000)">
      <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3"/>
    </g>
  </g>

  <!-- villa shadow (long, raking, dusk) -->
  <polygon points="380,640 1480,640 1660,920 240,920" fill="#000" opacity="0.45"/>

  <!-- lower volume travertine bar (in plan) -->
  <polygon points="440,600 1500,600 1520,860 460,860" fill="url(#travertineRoof)"/>
  <!-- subtle skylights / paving lines on roof -->
  <g stroke="#7a6d55" stroke-width="1" opacity="0.45">
    <line x1="700" y1="600" x2="710" y2="860"/>
    <line x1="960" y1="600" x2="970" y2="860"/>
    <line x1="1220" y1="600" x2="1230" y2="860"/>
    <line x1="450" y1="730" x2="1510" y2="730"/>
  </g>
  <!-- edge highlight on travertine (catching last sun) -->
  <polygon points="440,600 1500,600 1495,608 445,608" fill="#f4dcb0" opacity="0.7"/>

  <!-- upper volume charcoal concrete (cantilevered west) -->
  <polygon points="280,560 1240,560 1260,800 300,800" fill="url(#concreteRoof)"/>
  <!-- concrete texture lines -->
  <g stroke="#0a0908" stroke-width="1" opacity="0.4">
    <line x1="285" y1="640" x2="1245" y2="640"/>
    <line x1="290" y1="720" x2="1250" y2="720"/>
    <line x1="500" y1="560" x2="510" y2="800"/>
    <line x1="760" y1="560" x2="770" y2="800"/>
    <line x1="1020" y1="560" x2="1030" y2="800"/>
  </g>
  <!-- shadow line where upper meets lower volume on east side -->
  <polygon points="1240,560 1260,800 1500,820 1480,580" fill="#000" opacity="0.35"/>
  <!-- west cantilever edge shadow on terrain -->
  <polygon points="280,800 460,820 320,920 140,900" fill="#000" opacity="0.3"/>
  <!-- top edge of upper volume highlight -->
  <polygon points="280,560 1240,560 1235,567 285,567" fill="#7a6a5a" opacity="0.6"/>

  <!-- internal courtyard cut (with olive tree) -->
  <rect x="780" y="640" width="200" height="120" fill="url(#courtyardGlow)"/>
  <!-- olive tree from above -->
  <circle cx="880" cy="700" r="55" fill="#5a6a48" opacity="0.95"/>
  <circle cx="868" cy="690" r="38" fill="#7a8a6a" opacity="0.8"/>
  <circle cx="890" cy="710" r="30" fill="#3a4a2a" opacity="0.7"/>
  <!-- leaf cluster dots -->
  <g fill="#8a9a72" opacity="0.7">
    <circle cx="850" cy="680" r="3"/>
    <circle cx="870" cy="670" r="3"/>
    <circle cx="900" cy="685" r="3"/>
    <circle cx="910" cy="715" r="3"/>
    <circle cx="855" cy="720" r="3"/>
  </g>

  <!-- infinity pool (linear, west of villa, dark) -->
  <rect x="120" y="820" width="380" height="80" fill="url(#pool05)"/>
  <!-- pool edge highlight (last sun) -->
  <rect x="120" y="820" width="380" height="3" fill="#c47443" opacity="0.6"/>
  <!-- pool faint reflection -->
  <rect x="120" y="826" width="380" height="20" fill="#e8a868" opacity="0.18"/>

  <!-- travertine pool deck -->
  <polygon points="100,810 520,810 540,920 80,920" fill="#a89678" opacity="0.85"/>
  <!-- oak screen on deck (top-down lines) -->
  <g stroke="#3a2818" stroke-width="2" opacity="0.85">
    <line x1="540" y1="830" x2="540" y2="900"/>
    <line x1="555" y1="830" x2="555" y2="900"/>
    <line x1="570" y1="830" x2="570" y2="900"/>
    <line x1="585" y1="830" x2="585" y2="900"/>
  </g>
  <!-- fire pit on deck (small glowing dot) -->
  <circle cx="280" cy="940" r="8" fill="#ff8a3d" opacity="0.9"/>
  <circle cx="280" cy="940" r="4" fill="#ffd166"/>
  <ellipse cx="280" cy="940" rx="40" ry="20" fill="url(#uplight)"/>

  <!-- approach path (east side) -->
  <polygon points="1500,720 1900,700 1920,760 1520,780" fill="#a89678" opacity="0.85"/>
  <g stroke="#7a6d55" stroke-width="1" opacity="0.5">
    <line x1="1620" y1="710" x2="1640" y2="770"/>
    <line x1="1740" y1="705" x2="1760" y2="765"/>
    <line x1="1850" y1="700" x2="1870" y2="760"/>
  </g>

  <!-- landscape uplighting glows around villa -->
  <ellipse cx="440" cy="900" rx="80" ry="30" fill="url(#uplight)"/>
  <ellipse cx="700" cy="880" rx="60" ry="24" fill="url(#uplight)"/>
  <ellipse cx="1000" cy="880" rx="60" ry="24" fill="url(#uplight)"/>
  <ellipse cx="1300" cy="880" rx="60" ry="24" fill="url(#uplight)"/>
  <ellipse cx="1540" cy="850" rx="80" ry="30" fill="url(#uplight)"/>

  <!-- warm glow leaking from upper volume terrace -->
  <rect x="320" y="600" width="900" height="6" fill="#ffb84d" opacity="0.6"/>

  <!-- atmospheric vignette -->
  <radialGradient id="vignette05" cx="0.5" cy="0.6" r="0.75">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vignette05)"/>
</svg>
